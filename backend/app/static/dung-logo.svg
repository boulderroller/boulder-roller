<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beetleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="8"/>

  <!-- Beetle body (main oval) -->
  <ellipse cx="256" cy="280" rx="120" ry="100" fill="url(#beetleGrad)"/>

  <!-- Beetle head -->
  <circle cx="256" cy="170" r="55" fill="url(#beetleGrad)"/>

  <!-- Wing split line -->
  <line x1="256" y1="185" x2="256" y2="375" stroke="#374151" stroke-width="4"/>

  <!-- Left wing shine -->
  <ellipse cx="210" cy="260" rx="40" ry="60" fill="#374151" opacity="0.3"/>

  <!-- Right wing shine -->
  <ellipse cx="302" cy="260" rx="40" ry="60" fill="#374151" opacity="0.3"/>

  <!-- Antennae -->
  <path d="M220 145 Q200 100 180 80" stroke="#1F2937" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M292 145 Q312 100 332 80" stroke="#1F2937" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Antenna tips -->
  <circle cx="180" cy="80" r="12" fill="#1F2937"/>
  <circle cx="332" cy="80" r="12" fill="#1F2937"/>

  <!-- Eyes -->
  <circle cx="230" cy="160" r="15" fill="#FBBF24"/>
  <circle cx="282" cy="160" r="15" fill="#FBBF24"/>
  <circle cx="233" cy="157" r="6" fill="#1F2937"/>
  <circle cx="285" cy="157" r="6" fill="#1F2937"/>

  <!-- Legs (left side) -->
  <path d="M145 240 Q100 220 70 200" stroke="#1F2937" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M140 290 Q90 290 50 280" stroke="#1F2937" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M150 340 Q110 370 80 390" stroke="#1F2937" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Legs (right side) -->
  <path d="M367 240 Q412 220 442 200" stroke="#1F2937" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M372 290 Q422 290 462 280" stroke="#1F2937" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M362 340 Q402 370 432 390" stroke="#1F2937" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- DUNG text -->
  <text x="256" y="450" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">DUNG</text>
</svg>
