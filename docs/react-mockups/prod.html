<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Boulder Rollers - Production Mockup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f0b0b; --bg-elevated: #1a1616; --bg-card: #241e1e; --bg-soft: #332b2b;
      --accent: #D9381E; --accent-soft: rgba(217, 56, 30, 0.15); --accent-strong: #FF4D30; --accent-gold: #C5A059;
      --text: #F2F0E9; --text-soft: #B0A8A0; --text-softer: #807870;
      --border-subtle: #403535; --border-strong: #594a4a;
      --shadow-sharp: 4px 4px 0px rgba(0, 0, 0, 0.5);
      --radius-md: 4px;
      --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080808; color: var(--text); font-family: var(--font-body); height: 100vh; display: flex; justify-content: center; padding: 24px; }
    .app-shell { display: grid; grid-template-columns: 240px 1fr; width: 100%; max-width: 1400px; background: var(--bg-elevated); border: 1px solid var(--border-strong); box-shadow: var(--shadow-sharp); border-radius: var(--radius-md); overflow: hidden; }
    .sidebar { background: var(--bg); border-right: 1px solid var(--border-strong); padding: 24px 16px; display: flex; flex-direction: column; }
    .main { padding: 24px 32px; overflow-y: auto; background: #161616; }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-sharp); }
    .btn { background: var(--bg-soft); border: 1px solid var(--border-subtle); color: var(--text); padding: 12px 16px; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; cursor: pointer; box-shadow: 2px 2px 0 #000; transition: all 0.1s; border-radius: 2px; }
    .btn:hover { background: var(--border-subtle); }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent-strong); }
    .btn-gold { background: var(--accent-gold); color: #000; border-color: #D4B068; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .mono { font-family: var(--font-mono); }
    .gold { color: var(--accent-gold); }
    .red { color: var(--accent-strong); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: 8px 8px 0 rgba(0,0,0,0.5); max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal-header { padding: 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 24px; border-top: 1px solid var(--border-subtle); display: flex; gap: 12px; justify-content: flex-end; }
    /* Toast */
    .toast-container { position: fixed; top: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 12px; }
    .toast { background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 16px; min-width: 300px; box-shadow: var(--shadow-sharp); animation: slideIn 0.2s ease; }
    .toast.success { border-left: 4px solid var(--accent-gold); }
    .toast.error { border-left: 4px solid var(--accent); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* Input */
    .input { background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text); padding: 12px; border-radius: 2px; font-family: var(--font-body); width: 100%; }
    .input:focus { outline: none; border-color: var(--accent); }
    /* Loading */
    .spinner { border: 2px solid var(--border-subtle); border-top: 2px solid var(--accent); border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    /* Progress Bar */
    .progress-bar { background: var(--bg-elevated); height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { background: var(--accent-gold); height: 100%; transition: width 0.3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // Storage utility
    const storage = {
      get: (key, defaultValue) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultValue;
        } catch { return defaultValue; }
      },
      set: (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      }
    };

    // Icons
    const Icon = ({ name, size = 16, color = "currentColor" }) => {
      const icons = {
        X: <path d="M18 6 6 18M6 6l12 12"/>,
        Check: <path d="M20 6 9 17l-5-5"/>,
        Info: <><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></>,
        ChevronDown: <path d="m6 9 6 6 6-6"/>,
        Search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
        TrendingUp: <><polyline points="22,7 13.5,15.5 8.5,10.5 2,17"/><polyline points="16 7 22 7 22 13"/></>,
        LayoutDashboard: <><path d="M7 9a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M2 13a2 2 0 0 1 2-2h3"/><path d="M17 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3"/></>,
        Map: <><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/></>,
        User: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
        Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
        Filter: <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>,
        Plus: <><path d="M5 12h14"/><path d="M12 5v14"/></>,
        Minus: <path d="M5 12h14"/>
      };
      return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name] || <circle cx="12" cy="12" r="10"/>}</svg>;
    };

    // Toast Component
    const Toast = ({ message, type = 'info', onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
      }, [onClose]);
      return (
        <div className={`toast ${type}`}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '12px' }}>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <Icon name={type === 'success' ? 'Check' : 'Info'} color={type === 'success' ? '#C5A059' : '#D9381E'} />
              <span style={{ fontSize: '13px' }}>{message}</span>
            </div>
            <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>
              <Icon name="X" size={16} color="#807870" />
            </button>
          </div>
        </div>
      );
    };

    // Modal Component
    const Modal = ({ isOpen, onClose, title, children, footer }) => {
      if (!isOpen) return null;
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2 style={{ margin: 0, fontSize: '18px', fontWeight: 700 }}>{title}</h2>
              <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>
                <Icon name="X" size={20} />
              </button>
            </div>
            <div className="modal-body">{children}</div>
            {footer && <div className="modal-footer">{footer}</div>}
          </div>
        </div>
      );
    };

    // Chart Component (Simple SVG Line Chart)
    const LineChart = ({ data, width = 400, height = 120 }) => {
      const max = Math.max(...data);
      const min = Math.min(...data);
      const range = max - min || 1;
      const points = data.map((val, i) => {
        const x = (i / (data.length - 1)) * width;
        const y = height - ((val - min) / range) * (height - 20);
        return `${x},${y}`;
      }).join(' ');
      return (
        <svg width={width} height={height} style={{ display: 'block' }}>
          <polyline points={points} fill="none" stroke="#D9381E" strokeWidth="2" />
          {data.map((val, i) => {
            const x = (i / (data.length - 1)) * width;
            const y = height - ((val - min) / range) * (height - 20);
            return <circle key={i} cx={x} cy={y} r="3" fill="#C5A059" />;
          })}
        </svg>
      );
    };

    // Main App
    const App = () => {
      const [activeTab, setActiveTab] = useState('Dashboard');
      const [dungBalance, setDungBalance] = useState(() => storage.get('dungBalance', 12340.8));
      const [toasts, setToasts] = useState([]);
      const [modalState, setModalState] = useState({ open: false, type: null, data: null });
      const [searchFilter, setSearchFilter] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [tssHistory, setTssHistory] = useState(() => storage.get('tssHistory', [95, 110, 88, 118, 102, 130, 118]));

      useEffect(() => { storage.set('dungBalance', dungBalance); }, [dungBalance]);

      const addToast = useCallback((message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
      }, []);

      const removeToast = useCallback((id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      }, []);

      const handleClaim = useCallback(() => {
        setIsLoading(true);
        setTimeout(() => {
          setDungBalance(prev => prev + 36.5);
          addToast('✅ Successfully claimed 36.5 DUNG!', 'success');
          setIsLoading(false);
        }, 800);
      }, [addToast]);

      const handleStake = useCallback((pile, amount) => {
        setIsLoading(true);
        setTimeout(() => {
          addToast(`✅ Successfully staked ${amount} DUNG in ${pile.name}`, 'success');
          setModalState({ open: false, type: null, data: null });
          setIsLoading(false);
        }, 1000);
      }, [addToast]);

      const openPileModal = useCallback((pile) => {
        setModalState({ open: true, type: 'pile', data: pile });
      }, []);

      const openStakeModal = useCallback((pile) => {
        setModalState({ open: true, type: 'stake', data: pile });
      }, []);

      const closeModal = useCallback(() => {
        setModalState({ open: false, type: null, data: null });
      }, []);

      return (
        <div className="app-shell">
          <aside className="sidebar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '32px', paddingLeft: '4px' }}>
              <div style={{ width: '32px', height: '32px', borderRadius: '50%', background: 'var(--accent)', border: '2px solid #fff', boxShadow: '0 0 12px rgba(217, 56, 30, 0.5)' }}></div>
              <div>
                <div style={{ fontSize: '14px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '-0.01em' }}>Boulder Rollers</div>
                <div style={{ fontSize: '10px', color: 'var(--accent-gold)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Dung Beetle Cycling</div>
              </div>
            </div>
            <div style={{ marginBottom: '24px' }}>
              <div style={{ fontSize: '10px', textTransform: 'uppercase', color: 'var(--text-softer)', fontWeight: 600, letterSpacing: '0.05em', marginBottom: '8px', paddingLeft: '12px' }}>Main</div>
              {['Dashboard', 'Map', 'Beetle', 'History'].map(tab => (
                <div key={tab} onClick={() => setActiveTab(tab)} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 12px', borderRadius: '2px', cursor: 'pointer', color: activeTab === tab ? '#F2F0E9' : '#807870', background: activeTab === tab ? '#332b2b' : 'transparent', borderLeft: activeTab === tab ? '2px solid #D9381E' : '2px solid transparent', marginBottom: '2px', transition: 'all 0.1s' }}>
                  <Icon name={tab === 'Dashboard' ? 'LayoutDashboard' : tab === 'Map' ? 'Map' : tab === 'Beetle' ? 'User' : 'Activity'} size={16} color={activeTab === tab ? '#D9381E' : 'currentColor'} />
                  <span style={{ fontSize: '13px', fontWeight: 500 }}>{tab}</span>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 'auto', borderTop: '1px solid var(--border-subtle)', paddingTop: '16px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--text-softer)', marginBottom: '8px' }}>
                <span>Solana Status</span>
                <span className="gold">Healthy</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--text-softer)' }}>
                <span>Epoch</span>
                <span>12</span>
              </div>
            </div>
          </aside>

          <main className="main">
            <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '32px', borderBottom: '1px solid var(--border-subtle)', paddingBottom: '16px' }}>
              <div>
                <div style={{ fontSize: '11px', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 600, letterSpacing: '0.05em', marginBottom: '4px' }}>{activeTab}</div>
                <div style={{ fontSize: '24px', fontWeight: 700, letterSpacing: '-0.02em' }}>
                  {activeTab === 'Dashboard' && "Today's Roll"}
                  {activeTab === 'Map' && 'Pile Explorer (with Search)'}
                  {activeTab === 'Beetle' && 'My Beetle'}
                  {activeTab === 'History' && 'Ride Archive'}
                </div>
              </div>
              <div style={{ display: 'flex', gap: '12px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 12px', background: '#0a0a0a', border: '1px solid var(--border-subtle)', borderRadius: '4px' }}>
                  <span style={{ fontSize: '10px', fontWeight: 600, textTransform: 'uppercase', color: 'var(--text-softer)' }}>DUNG</span>
                  <span className="mono gold" style={{ fontSize: '12px', fontWeight: 500 }}>{dungBalance.toLocaleString()}</span>
                </div>
              </div>
            </header>

            {activeTab === 'Dashboard' && (
              <div className="card">
                <div style={{ marginBottom: '20px' }}>
                  <div style={{ fontSize: '10px', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 600 }}>TSS Trend</div>
                  <div style={{ fontSize: '15px', fontWeight: 600 }}>Last 7 Days</div>
                </div>
                <LineChart data={tssHistory} width={600} height={120} />
                <div style={{ marginTop: '24px', padding: '16px', background: 'var(--bg-elevated)', border: '1px solid var(--border-subtle)', borderRadius: '2px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                      <div style={{ fontSize: '10px', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 600 }}>Payouts</div>
                      <div style={{ fontSize: '15px', fontWeight: 600 }}>Unclaimed: 36.5 DUNG</div>
                    </div>
                    <button className="btn btn-primary" onClick={handleClaim} disabled={isLoading}>
                      {isLoading ? <span className="spinner"></span> : 'Claim Rewards'}
                    </button>
                  </div>
                </div>
                <div style={{ marginTop: '24px' }}>
                  <div style={{ fontSize: '10px', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 600, marginBottom: '12px' }}>CAL Energy Usage</div>
                  <div className="progress-bar">
                    <div className="progress-fill" style={{ width: '64%' }}></div>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', marginTop: '8px' }}>
                    <span className="mono" style={{ color: 'var(--text-soft)' }}>1,600 / 2,500</span>
                    <span className="mono gold">64%</span>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'Map' && (
              <div className="card">
                <div style={{ marginBottom: '16px', display: 'flex', gap: '12px' }}>
                  <div style={{ position: 'relative', flex: 1 }}>
                    <input className="input" placeholder="Search piles..." value={searchFilter} onChange={(e) => setSearchFilter(e.target.value)} />
                    <div style={{ position: 'absolute', right: '12px', top: '50%', transform: 'translateY(-50%)' }}>
                      <Icon name="Search" size={16} color="#807870" />
                    </div>
                  </div>
                  <button className="btn"><Icon name="Filter" size={14} /> Filter</button>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px' }}>
                  {[
                    { id: 1, name: "Col du Bas Bois", type: "Gravel", pot: 420.5, apy: 14.2 },
                    { id: 2, name: "Philly Crit Circuit", type: "Road", pot: 112.0, apy: 18.7 },
                    { id: 3, name: "Manayunk Wall", type: "Road", pot: 850.2, apy: 22.1 },
                    { id: 4, name: "Back Alley Sprint", type: "Urban", pot: 88.4, apy: 9.8 }
                  ].filter(p => p.name.toLowerCase().includes(searchFilter.toLowerCase())).map(pile => (
                    <div key={pile.id} style={{ background: 'var(--bg-elevated)', border: '1px solid var(--border-subtle)', padding: '16px', borderRadius: '2px', cursor: 'pointer' }} onClick={() => openPileModal(pile)}>
                      <div style={{ fontSize: '14px', fontWeight: 600, marginBottom: '8px' }}>{pile.name}</div>
                      <div style={{ fontSize: '11px', color: 'var(--text-soft)', marginBottom: '12px' }}>{pile.type}</div>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <div>
                          <div style={{ fontSize: '10px', color: 'var(--text-softer)' }}>Pot</div>
                          <div className="mono gold" style={{ fontSize: '13px' }}>{pile.pot} DUNG</div>
                        </div>
                        <div>
                          <div style={{ fontSize: '10px', color: 'var(--text-softer)' }}>APY</div>
                          <div className="mono" style={{ fontSize: '13px', color: '#2EFF5D' }}>{pile.apy}%</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'Beetle' && (
              <div className="card">
                <div style={{ textAlign: 'center', marginBottom: '24px' }}>
                  <div style={{ width: '120px', height: '120px', margin: '0 auto 16px', background: 'linear-gradient(135deg, var(--bg-soft) 0%, var(--bg-card) 100%)', border: '2px solid var(--accent)', borderRadius: '4px', boxShadow: '4px 4px 0 rgba(0,0,0,0.2)', position: 'relative' }}>
                    <div style={{ position: 'absolute', inset: '10px', border: '1px dashed var(--border-strong)', borderRadius: '2px' }}></div>
                  </div>
                  <div style={{ fontSize: '18px', fontWeight: 700 }}>booka_shade</div>
                  <div style={{ fontSize: '11px', color: 'var(--text-soft)' }}>S-Grade Shell · Coherence 92/100</div>
                </div>
                <div style={{ background: 'var(--bg-elevated)', padding: '16px', borderRadius: '2px', border: '1px solid var(--border-subtle)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px' }}>
                    <span style={{ fontSize: '11px' }}>Career TSS</span>
                    <span className="mono" style={{ fontSize: '11px' }}>74,320</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ fontSize: '11px' }}>Active Bonuses</span>
                    <span className="mono gold" style={{ fontSize: '11px' }}>+5% DUNG</span>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'History' && (
              <div className="card">
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ borderBottom: '2px solid var(--border-strong)' }}>
                      <th style={{ padding: '12px', textAlign: 'left', fontSize: '10px', textTransform: 'uppercase', color: 'var(--text-softer)', fontWeight: 600 }}>Date</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontSize: '10px', textTransform: 'uppercase', color: 'var(--text-softer)', fontWeight: 600 }}>TSS</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontSize: '10px', textTransform: 'uppercase', color: 'var(--text-softer)', fontWeight: 600 }}>DUNG</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontSize: '10px', textTransform: 'uppercase', color: 'var(--text-softer)', fontWeight: 600 }}>CAL</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[
                      { id: 1, date: "2025-11-25", tss: 118, dung: 118, cal: 900 },
                      { id: 2, date: "2025-11-24", tss: 82, dung: 82, cal: 600 },
                      { id: 3, date: "2025-11-23", tss: 145, dung: 145, cal: 1100 }
                    ].map(ride => (
                      <tr key={ride.id} style={{ borderBottom: '1px solid var(--border-subtle)' }}>
                        <td style={{ padding: '12px', fontWeight: 600 }}>{ride.date}</td>
                        <td className="mono" style={{ padding: '12px' }}>{ride.tss}</td>
                        <td className="mono gold" style={{ padding: '12px', fontWeight: 500 }}>+{ride.dung}</td>
                        <td className="mono" style={{ padding: '12px', color: 'var(--text-soft)' }}>{ride.cal}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {/* Modals */}
          {modalState.type === 'pile' && (
            <Modal isOpen={modalState.open} onClose={closeModal} title={modalState.data.name} footer={
              <>
                <button className="btn" onClick={closeModal}>Close</button>
                <button className="btn btn-primary" onClick={() => openStakeModal(modalState.data)}>Stake DUNG</button>
              </>
            }>
              <div>
                <div style={{ marginBottom: '16px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--text-softer)', marginBottom: '4px' }}>Type</div>
                  <div style={{ fontSize: '14px' }}>{modalState.data.type}</div>
                </div>
                <div style={{ marginBottom: '16px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--text-softer)', marginBottom: '4px' }}>Current Pot</div>
                  <div className="mono gold" style={{ fontSize: '16px' }}>{modalState.data.pot} DUNG</div>
                </div>
                <div>
                  <div style={{ fontSize: '11px', color: 'var(--text-softer)', marginBottom: '4px' }}>Estimated APY</div>
                  <div className="mono" style={{ fontSize: '16px', color: '#2EFF5D' }}>{modalState.data.apy}%</div>
                </div>
              </div>
            </Modal>
          )}

          {modalState.type === 'stake' && (
            <Modal isOpen={modalState.open} onClose={closeModal} title={`Stake in ${modalState.data.name}`} footer={
              <>
                <button className="btn" onClick={closeModal}>Cancel</button>
                <button className="btn btn-primary" onClick={() => handleStake(modalState.data, 100)} disabled={isLoading}>
                  {isLoading ? <span className="spinner"></span> : 'Stake 100 DUNG'}
                </button>
              </>
            }>
              <div>
                <div style={{ marginBottom: '16px' }}>
                  <label style={{ display: 'block', marginBottom: '8px', fontSize: '12px', fontWeight: 600 }}>Amount</label>
                  <input className="input" type="number" placeholder="100" defaultValue="100" />
                </div>
                <div style={{ background: 'var(--bg-elevated)', padding: '12px', borderRadius: '2px' }}>
                  <div style={{ fontSize: '11px', color: 'var(--text-soft)' }}>Your estimated returns: <span className="mono gold">+{modalState.data.apy}% APY</span></div>
                </div>
              </div>
            </Modal>
          )}

          {/* Toast Container */}
          <div className="toast-container">
            {toasts.map(toast => (
              <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => removeToast(toast.id)} />
            ))}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
