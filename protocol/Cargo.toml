[workspace]
members = [
    "anchor/programs/boulder_rollers"
]
resolver = "2"

[profile.release]
overflow-checks = true

[workspace.dependencies]
# Keep Anchor aligned with protocol/anchor and the Solana CI toolchain.
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
thiserror = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
