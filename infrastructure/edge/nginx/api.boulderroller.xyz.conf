# Canonical Boulder Roller API edge configuration (host-level nginx)
# Source of truth for production ingress on droplets that terminate TLS.

# Redirect legacy API hostname to canonical .xyz API host.
server {
    listen 80;
    listen [::]:80;
    server_name api.boulderroller.org;
    return 301 https://api.boulderroller.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.boulderroller.org;

    ssl_certificate /etc/letsencrypt/live/api.boulderroller.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boulderroller.org/privkey.pem;

    return 301 https://api.boulderroller.xyz$request_uri;
}

# Canonical API host.
server {
    listen 80;
    listen [::]:80;
    server_name api.boulderroller.xyz;
    return 301 https://api.boulderroller.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.boulderroller.xyz;

    ssl_certificate /etc/letsencrypt/live/api.boulderroller.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boulderroller.xyz/privkey.pem;

    # Basic TLS hardening.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
