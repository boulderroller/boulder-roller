server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: boulder-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: boulder-api
          host: ${HOSTNAME}
          __path__: /var/log/boulder/*.log
