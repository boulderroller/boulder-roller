global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      repeat_interval: 1h

receivers:
  - name: 'default-receiver'
    # TODO: Replace with actual Slack/Discord webhook URL before mainnet
    webhook_configs:
      - url: 'http://localhost:9095/alert-sink'
        send_resolved: true
        # Placeholder: use a local sink or replace with real webhook.
        # For Slack: https://hooks.slack.com/services/T.../B.../xxx
        # For Discord: https://discord.com/api/webhooks/.../...

  - name: 'critical-receiver'
    # TODO: Replace with actual Slack/Discord/PagerDuty webhook URL
    webhook_configs:
      - url: 'http://localhost:9095/alert-sink-critical'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
