global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'boulder-api'
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/boulder-api-metrics-token
    static_configs:
      - targets: ['boulder-api:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
